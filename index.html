<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2E7A4E">
<title>식단 달력</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍚</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@500;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="page">
  <header class="top">
    <h1 class="month" id="monthTitle" aria-live="polite"></h1>
    <nav class="monthnav" aria-label="달 이동">
      <button type="button" id="prevMonth" aria-label="이전 달">‹</button>
      <button type="button" id="todayBtn" class="today-btn">오늘</button>
      <button type="button" id="nextMonth" aria-label="다음 달">›</button>
    </nav>
    <p class="summary" id="summary"></p>
  </header>

  <section class="calendar" aria-label="월간 섭취 칼로리">
    <div class="weekdays" aria-hidden="true">
      <span class="sun">일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span class="sat">토</span>
    </div>
    <div class="days" id="days"></div>
  </section>

  <footer class="foot">
    <p id="syncStatus" role="status"></p>
    <div class="backup">
      <button type="button" id="syncBtn">동기화 설정</button>
      <button type="button" id="exportBtn">백업 파일 저장</button>
      <button type="button" id="importBtn">백업 불러오기</button>
      <input type="file" id="importFile" accept="application/json,.json" hidden>
    </div>
  </footer>
</main>

<dialog class="sheet" id="sheet" aria-labelledby="sheetDate">
  <form method="dialog" id="sheetForm" autocomplete="off">
    <header class="sheet-head">
      <button type="button" id="prevDay" class="daynav" aria-label="전날">‹</button>
      <h2 id="sheetDate"></h2>
      <button type="button" id="nextDay" class="daynav" aria-label="다음 날">›</button>
      <p class="sheet-total"><span>합계</span> <strong id="sheetTotal">0</strong> kcal</p>
    </header>
    <div class="meals-edit" id="mealsEdit"></div>
    <footer class="sheet-foot">
      <span class="saved" id="saved" role="status"></span>
      <button type="submit" class="done">완료</button>
    </footer>
  </form>
</dialog>

<dialog class="sheet settings" id="syncDlg" aria-labelledby="syncTitle">
  <form method="dialog" id="syncForm" autocomplete="off">
    <header class="sheet-head plain"><h2 id="syncTitle">동기화 설정</h2></header>
    <div class="settings-body">
      <p class="hint" id="syncHint"></p>
      <div id="syncFields">
        <label for="syncRepo">기록을 저장할 비공개 저장소</label>
        <input id="syncRepo" type="text" inputmode="url" spellcheck="false" autocapitalize="off" placeholder="사용자이름/diet-data">
        <label for="syncToken">GitHub 토큰 (해당 저장소 Contents: Read and write)</label>
        <input id="syncToken" type="password" spellcheck="false" autocapitalize="off" placeholder="github_pat_…">
      </div>
      <p class="error" id="syncError" role="alert"></p>
    </div>
    <footer class="sheet-foot wrap">
      <button type="button" class="ghost" id="syncDisconnect" hidden>연결 끊기</button>
      <button type="button" class="ghost" id="syncLink" hidden>다른 기기용 링크 복사</button>
      <span class="spacer"></span>
      <button type="button" class="ghost" id="syncCancel">닫기</button>
      <button type="button" class="done" id="syncConnect">연결</button>
    </footer>
  </form>
</dialog>

<script src="app.js"></script>
</body>
</html>
